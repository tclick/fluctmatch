# .github/workflows/docs.yml
name: Deploy Documentation

on:
  push:
    branches:
      - main
      - develop # Allows you to preview docs changes as you develop the 4.0.0 revamp

jobs:
  deploy-docs:
    name: Build & Deploy Docs
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial: Allows the runner to create and write to the gh-pages branch
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      # Build the static site into the default ./site directory
      - name: Compile MkDocs Site
        run: pixi run -e docs docs-build

      # Deploy the static assets seamlessly to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
