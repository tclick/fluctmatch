# .github/workflows/pr-validation.yml
name: PR Validation Suite

on:
  pull_request:
    branches: [ develop, main ]

jobs:
  # Job 1: Format & Lint validation via native Pixi-wrapped pre-commit
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Ensures pre-commit can evaluate files accurately across commits

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      # ✓ CRITICAL UPDATE: Run pre-commit natively via Pixi instead of using the pre-commit action
      - name: Run Pre-Commit Hooks
        run: pixi run pre-commit run --all-files --show-diff-on-failure

  # Job 2: Static type checking using basedpyright
  # NOTE: Since basedpyright is already executing in your pre-commit suite above,
  # you can actually REMOVE this redundant standalone job to save CI runner minutes!
  # If you prefer to keep them decoupled for clearer failure reporting, leave it as is:
  type-check:
    name: Type Check (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      - name: Run Basedpyright
        run: pixi run basedpyright

  # Job 3: Parallelized physics/matrix unit tests
  unit-tests:
    name: Run Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.6
        with:
          cache: true

      # Runs pytest within the environment sandbox
      - name: Execute Tests with Coverage
        run: pixi run pytest --cov=src/ --cov-report=xml

      - name: Upload Coverage to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
